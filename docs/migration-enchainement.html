  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {

      --soft: #5f5f5f;
      --rule: rgba(0, 0, 0, 0.14);

      --mono: 'Geist Mono', ui-monospace, monospace;

    body {
      margin: 0;
      padding: 32px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
    }
    main { max-width: 1600px; margin: 0 auto; }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font: 500 11px var(--mono);
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 12px;
      font: 400 clamp(28px, 4vw, 40px)/1.1 var(--serif);
    }
    .lede { max-width: 78ch; margin: 0 0 24px; color: var(--muted); line-height: 1.55; }
    .diagram-container { width: 100%; max-width: 100%; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 1600px; }
    @media print {
      body { padding: 0; }
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
