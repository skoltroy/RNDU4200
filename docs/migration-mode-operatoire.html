<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mode opératoire — ReadyNAS Ultra 4</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --paper: #f5f5f3;
      --ink: #111111;
      --muted: #4f4f4f;
      --soft: #5f5f5f;
      --rule: rgba(0, 0, 0, 0.14);
      --accent: #bf4520;
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', Georgia, serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      margin: 0;
      padding: 32px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
    }
    main { max-width: 1600px; margin: 0 auto; }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font: 500 11px var(--mono);
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 12px;
      font: 400 clamp(28px, 4vw, 40px)/1.1 var(--serif);
    }
    .lede { max-width: 76ch; margin: 0 0 24px; color: var(--muted); line-height: 1.55; }
    .diagram-container { width: 100%; max-width: 100%; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 1600px; }
    @media print {
      body { padding: 0; }
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">ReadyNAS Ultra 4 · Migration R4 → R6</p>
    <h1>Mode opératoire : qui fait quoi</h1>
    <p class="lede">Vue d’ensemble des responsabilités et des transferts, du poste d’administration jusqu’à la validation sous OS 6. La sauvegarde précède toute opération susceptible d’effacer les disques.</p>
    <div class="diagram-container">
      <svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mode-title mode-desc">
        <title id="mode-title">Mode opératoire de migration du ReadyNAS Ultra 4</title>
        <desc id="mode-desc">Le parcours relie la préparation et la sauvegarde, l’installation de l’add-on et du firmware de transition sous RAIDiator, puis le premier démarrage et la validation de ReadyNAS OS 6.9.6.</desc>
        <defs>
          <marker id="mode-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f4f4f"/>
          </marker>
        </defs>
        <rect width="1600" height="900" fill="#f5f5f3"/>
        <g transform="scale(1.25)">

        <rect x="190" y="104" width="1040" height="144" fill="#ffffff" opacity="0.55"/>
        <rect x="190" y="392" width="1040" height="144" fill="#ffffff" opacity="0.55"/>
        <line x1="190" y1="104" x2="1230" y2="104" stroke="rgba(0,0,0,0.14)"/>
        <line x1="190" y1="248" x2="1230" y2="248" stroke="rgba(0,0,0,0.14)"/>
        <line x1="190" y1="392" x2="1230" y2="392" stroke="rgba(0,0,0,0.14)"/>
        <line x1="190" y1="536" x2="1230" y2="536" stroke="rgba(0,0,0,0.14)"/>
        <line x1="190" y1="104" x2="190" y2="536" stroke="rgba(0,0,0,0.20)"/>

        <line x1="352" y1="176" x2="400" y2="176" stroke="#4f4f4f" stroke-width="1.5" marker-end="url(#mode-arrow)"/>
        <path d="M520 176 H620 Q628 176 628 184 V280" fill="none" stroke="#4f4f4f" stroke-width="1.5" marker-end="url(#mode-arrow)"/>
        <line x1="688" y1="320" x2="736" y2="320" stroke="#4f4f4f" stroke-width="1.5" marker-end="url(#mode-arrow)"/>
        <path d="M856 320 H956 Q964 320 964 328 V424" fill="none" stroke="#4f4f4f" stroke-width="1.5" marker-end="url(#mode-arrow)"/>
        <line x1="1024" y1="464" x2="1072" y2="464" stroke="#4f4f4f" stroke-width="1.5" marker-end="url(#mode-arrow)"/>

        <text x="54" y="168" fill="#4f4f4f" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" font-weight="500" letter-spacing="1.2">ADMIN</text>
        <text x="54" y="184" fill="#111111" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600">Poste local</text>
        <text x="54" y="312" fill="#4f4f4f" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" font-weight="500" letter-spacing="1.2">RAIDiator 4</text>
        <text x="54" y="328" fill="#111111" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600">Interface legacy</text>
        <text x="54" y="456" fill="#4f4f4f" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" font-weight="500" letter-spacing="1.2">READY NAS OS 6</text>
        <text x="54" y="472" fill="#111111" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600">Interface cible</text>

        <g>
          <rect x="232" y="136" width="120" height="80" rx="6" fill="#ffffff" stroke="rgba(0,0,0,0.14)"/>
          <text x="244" y="154" fill="#5f5f5f" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="1">01 · PRÉPARER</text>
          <text x="244" y="178" fill="#111111" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600">Sauvegarder</text>
          <text x="244" y="196" fill="#4f4f4f" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">partages + config</text>
        </g>
        <g>
          <rect x="400" y="136" width="120" height="80" rx="6" fill="#ffffff" stroke="rgba(0,0,0,0.14)"/>
          <text x="412" y="154" fill="#5f5f5f" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="1">02 · VÉRIFIER</text>
          <text x="412" y="178" fill="#111111" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600">Préparer les ZIP</text>
          <text x="412" y="196" fill="#4f4f4f" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">ZIP · nom vérifié</text>
        </g>
        <g>
          <rect x="568" y="280" width="120" height="80" rx="6" fill="#ffffff" stroke="rgba(0,0,0,0.14)"/>
          <text x="580" y="298" fill="#5f5f5f" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="1">03 · INSTALLER</text>
          <text x="580" y="322" fill="#111111" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600">Installer l’add-on</text>
          <text x="580" y="340" fill="#4f4f4f" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">Prep_Addon.bin</text>
        </g>
        <g>
          <rect x="736" y="280" width="120" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.5"/>
          <text x="748" y="298" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="1">04 · TRANSITION</text>
          <text x="748" y="322" fill="#111111" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600">Flasher 6.9.5</text>
          <text x="748" y="340" fill="#4f4f4f" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">R4toR6_6.9.5.bin</text>
        </g>
        <g>
          <rect x="904" y="424" width="120" height="80" rx="6" fill="#ffffff" stroke="rgba(0,0,0,0.14)"/>
          <text x="916" y="442" fill="#5f5f5f" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="1">05 · REDÉMARRER</text>
          <text x="916" y="466" fill="#111111" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600">Initialiser OS 6</text>
          <text x="916" y="484" fill="#4f4f4f" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">attendre DHCP</text>
        </g>
        <g>
          <rect x="1072" y="424" width="120" height="80" rx="6" fill="#ffffff" stroke="rgba(0,0,0,0.14)"/>
          <text x="1084" y="442" fill="#5f5f5f" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="1">06 · VALIDER</text>
          <text x="1084" y="466" fill="#111111" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600">Installer 6.9.6</text>
          <text x="1084" y="484" fill="#4f4f4f" font-family="'Geist Mono', ui-monospace, monospace" font-size="8">valider · restaurer</text>
        </g>

        <line x1="48" y1="620" x2="1232" y2="620" stroke="rgba(0,0,0,0.14)"/>
        <text x="48" y="652" fill="#4f4f4f" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="1.2">REPÈRES</text>
        <circle cx="142" cy="648" r="4" fill="#111111"/>
        <text x="154" y="652" fill="#4f4f4f" font-family="'Geist', system-ui, sans-serif" font-size="10">L’opérateur agit depuis le LAN</text>
        <circle cx="398" cy="648" r="4" fill="#111111"/>
        <text x="410" y="652" fill="#4f4f4f" font-family="'Geist', system-ui, sans-serif" font-size="10">RAIDiator reçoit l’add-on puis l’image de transition</text>
        <rect x="800" y="642" width="12" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
        <text x="820" y="652" fill="#4f4f4f" font-family="'Geist', system-ui, sans-serif" font-size="10">Bascule critique : le BIN 6.9.5 n’est pas l’image finale</text>
        </g>
      </svg>
    </div>
  </main>
</body>
</html>
